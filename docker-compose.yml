# Development dependencies. No MongoDB: this project is PostgreSQL only.
#
# Host ports are shifted off the defaults so this stack can run next to the other OrangCode
# projects on the same machine. Inside the compose network the services still use their
# standard ports, so only the left-hand side of each mapping is unusual.
name: ecommerce-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: ecommerce
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql: it stores PGDATA in a
      # major-version subdirectory so `pg_upgrade --link` can work across the same mount.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d ecommerce']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for the product images. The application talks plain S3, so
  # moving to AWS, Scaleway or any other provider is a change of endpoint and credentials.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: shop
      MINIO_ROOT_PASSWORD: shop-secret
    ports:
      - '9010:9000'
      - '9011:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once and exits. Keeps bucket provisioning out of the application,
  # where it would run on every boot of every instance.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 shop shop-secret &&
      mc mb --ignore-existing local/shop-media &&
      echo 'bucket ready'"

  # Catches every outgoing email in development: no order confirmation can reach a real
  # inbox by accident. SMTP on 1026, web interface on http://localhost:8026.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1026:1025'
      - '8026:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
